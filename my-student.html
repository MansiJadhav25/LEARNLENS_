<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LearnLens | My Students</title>

    <!-- My Students CSS -->
    <link rel="stylesheet"
          href="my-student.css">

</head>


<body>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="logo-area">

            <h1>
                LearnLens
            </h1>

            <p>
                Academic Learning
            </p>

        </div>



        <!-- TEACHER PROFILE -->

        <div class="profile">

            <div class="profile-icon">
                👩‍🏫
            </div>

            <h3>
                Professor
            </h3>

            <p>
                Teacher
            </p>

        </div>



        <!-- NAVIGATION -->

        <nav>


            <a href="teacher-dashboard.html">

                🏠 Dashboard

            </a>


            <a href="my-student.html"
               class="active">

                👨‍🎓 My Students

            </a>


            <a href="enter-marks.html">

                📝 Enter Marks

            </a>


            <a href="performance.html">

                📊 Performance

            </a>


            <a href="weak-areas.html">

                ⚠️ Weak Areas

            </a>


            <a href="reports.html">

                📋 Reports

            </a>


            <a href="notifications.html">

                🔔 Notifications

            </a>


        </nav>



        <!-- RETURN TO ENTRANCE -->

        <div class="logout">

            <a href="index.html">

                🚪 Return to Entrance

            </a>

        </div>


    </aside>




    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="main-content">


        <!-- PAGE HEADER -->

        <header class="page-header">

            <h1>
                My Students
            </h1>

            <p>
                View and analyse the performance of all your students.
            </p>

        </header>




        <!-- =================================================
             STUDENTS SECTION
        ================================================== -->

        <section class="students-section">


            <!-- SECTION TITLE -->

            <div class="section-title">

                <h2>
                    Student Records
                </h2>

                <span id="studentCount">
                    0 Students
                </span>

            </div>




            <!-- =================================================
                 STUDENT LIST
            ================================================== -->

            <div id="studentList"
                 class="student-list">


                <!-- Students will be added here using JavaScript -->


            </div>


        </section>




    </main>




    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script>


        /* =================================================
           CHECK TEACHER LOGIN
        ================================================= */

        const loggedInRole =
            localStorage.getItem(
                "learnlensLoggedInRole"
            );


        if (loggedInRole !== "teacher") {

            alert(
                "🔐 Please login as a teacher first."
            );

            window.location.href =
                "login.html";

        }




        /* =================================================
           GET STUDENTS
        ================================================= */

        function getStudents() {


            const savedData =
                localStorage.getItem(
                    "learnlensStudents"
                );


            if (!savedData) {

                return [];

            }


            try {

                return JSON.parse(
                    savedData
                );

            }

            catch (error) {

                console.log(
                    "Student data could not be loaded."
                );

                return [];

            }

        }




        /* =================================================
           SHORT SUBJECT NAME
        ================================================= */

        function shortSubjectName(subject) {


            if (!subject) {

                return "--";

            }


            if (
                subject.includes(
                    "Mathematics"
                )
            ) {

                return "MIS";

            }


            if (
                subject.includes(
                    "Database"
                )
            ) {

                return "DBMS";

            }


            if (
                subject.includes(
                    "DBMS"
                )
            ) {

                return "DBMS";

            }


            if (
                subject.includes(
                    "Computer System"
                )
            ) {

                return "CSF";

            }


            if (
                subject.includes(
                    "Universal"
                )
            ) {

                return "UHV";

            }


            if (
                subject.includes(
                    "Open Elective"
                )
            ) {

                return "Open Elective";

            }


            return subject;

        }




        /* =================================================
           VIEW STUDENT PERFORMANCE
        ================================================= */

        function viewPerformance(index) {


            const students =
                getStudents();


            const student =
                students[index];


            if (!student) {

                alert(
                    "Student information could not be found."
                );

                return;

            }


            /*
             Save selected student so the
             Performance page can display it.
            */

            localStorage.setItem(
                "learnlensCurrentStudent",
                JSON.stringify(student)
            );


            window.location.href =
                "performance.html";

        }




        /* =================================================
           DISPLAY STUDENTS
        ================================================= */

        function displayStudents() {


            const students =
                getStudents();


            const studentList =
                document.getElementById(
                    "studentList"
                );


            const studentCount =
                document.getElementById(
                    "studentCount"
                );


            /*
             Clear previous content
            */

            studentList.innerHTML = "";



            /* =================================================
               STUDENT COUNT
            ================================================= */

            if (students.length === 1) {

                studentCount.textContent =
                    "1 Student";

            }

            else {

                studentCount.textContent =
                    students.length +
                    " Students";

            }




            /* =================================================
               NO STUDENTS
            ================================================= */

            if (students.length === 0) {


                studentList.innerHTML = `

                    <div class="empty-message">

                        <div class="empty-icon">
                            👨‍🎓
                        </div>

                        <h2>
                            No Student Records Yet
                        </h2>

                        <p>
                            Enter student marks to create
                            the first student record.
                        </p>

                        <a
                            href="enter-marks.html"
                            class="magic-button"
                        >
                            + Enter Student Marks
                        </a>

                    </div>

                `;

                return;

            }




            /* =================================================
               CREATE STUDENT CARDS
            ================================================= */

            students.forEach(
                function(student, index) {


                    /* -----------------------------------------
                       CATEGORY
                    ----------------------------------------- */

                    let categoryClass =
                        "moderate";


                    if (
                        student.category ===
                        "Advanced Learner"
                    ) {

                        categoryClass =
                            "advanced";

                    }


                    else if (
                        student.category ===
                        "Slow Learner"
                    ) {

                        categoryClass =
                            "slow";

                    }




                    /* -----------------------------------------
                       CARD
                    ----------------------------------------- */

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "student-card";



                    card.innerHTML = `

                        <!-- STUDENT TOP -->

                        <div class="student-top">

                            <div class="student-icon">
                                👨‍🎓
                            </div>


                            <div>

                                <h2>
                                    ${student.name || "Student"}
                                </h2>

                                <p>
                                    Roll No:
                                    ${student.rollNumber || "--"}
                                </p>

                            </div>

                        </div>



                        <!-- STUDENT DETAILS -->

                        <div class="student-details">


                            <div class="detail-box">

                                <span>
                                    Percentage
                                </span>

                                <strong>
                                    ${student.percentage || 0}%
                                </strong>

                            </div>



                            <div class="detail-box">

                                <span>
                                    Average
                                </span>

                                <strong>
                                    ${student.average || 0}
                                </strong>

                            </div>



                            <div class="detail-box">

                                <span>
                                    Strongest Subject
                                </span>

                                <strong>
                                    ${shortSubjectName(
                                        student.strongestSubject
                                    )}
                                </strong>

                            </div>



                            <div class="detail-box">

                                <span>
                                    Weakest Subject
                                </span>

                                <strong>
                                    ${shortSubjectName(
                                        student.weakestSubject
                                    )}
                                </strong>

                            </div>



                            <div class="detail-box">

                                <span>
                                    Learner Category
                                </span>

                                <strong
                                    class="category ${categoryClass}"
                                >
                                    ${student.category || "Moderate Learner"}
                                </strong>

                            </div>


                        </div>



                        <!-- BUTTON -->

                        <div class="student-actions">

                            <button
                                class="view-button"
                                onclick="viewPerformance(${index})"
                            >

                                View Performance

                            </button>

                        </div>

                    `;


                    studentList.appendChild(
                        card
                    );

                }
            );

        }




        /* =================================================
           LOAD PAGE
        ================================================= */

        displayStudents();


    </script>


</body>

</html>
