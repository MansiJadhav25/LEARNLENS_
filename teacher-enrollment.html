<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LearnLens | Teacher Enrollment</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f7fa;
            color: #263746;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .enrollment-card {
            width: 100%;
            max-width: 480px;

            padding: 35px;

            background: #ffffff;

            border: 1px solid #dce4eb;
            border-radius: 14px;

            box-shadow:
                0 4px 18px rgba(25, 59, 90, 0.10);
        }

        .page-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e8f1f8;

            border-radius: 50%;

            font-size: 30px;
        }

        h1 {
            text-align: center;

            margin: 0 0 8px;

            font-size: 28px;

            color: #193b5a;

            font-weight: 600;
        }

        .subtitle {
            text-align: center;

            color: #687887;

            font-size: 14px;

            line-height: 1.5;

            margin: 0 0 25px;
        }

        label {
            display: block;

            margin-top: 16px;
            margin-bottom: 7px;

            color: #193b5a;

            font-size: 13px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px 13px;

            border-radius: 6px;

            border: 1px solid #cbd6df;

            background: #ffffff;

            color: #263746;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;
        }

        input:focus {
            border-color: #347db3;

            box-shadow:
                0 0 0 3px rgba(52, 125, 179, 0.10);
        }

        input::placeholder {
            color: #9aa7b2;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 6px;

            background: #347db3;

            color: #ffffff;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        button:hover {
            background: #286895;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #687887;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #347db3;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .enrollment-card {
                padding: 25px 22px;
            }

            h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <div class="enrollment-card">


        <div class="page-icon">
            👨‍🏫
        </div>


        <h1>
            Teacher Enrollment
        </h1>


        <p class="subtitle">
            Create your LearnLens teacher account
        </p>


        <form id="teacherForm">


            <label for="teacherName">
                Teacher Name
            </label>

            <input
                type="text"
                id="teacherName"
                placeholder="Enter your name"
                required
            >


            <label for="teacherEmail">
                Email
            </label>

            <input
                type="email"
                id="teacherEmail"
                placeholder="Enter your email"
                required
            >


            <label for="teacherUsername">
                Create Username
            </label>

            <input
                type="text"
                id="teacherUsername"
                placeholder="Choose a username"
                required
            >


            <label for="teacherPassword">
                Create Password
            </label>

            <input
                type="password"
                id="teacherPassword"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Teacher Account
            </button>


        </form>


        <a
            href="index.html"
            class="back"
        >
            ← Return to LearnLens Entrance
        </a>


    </div>



    <script>

        document
            .getElementById("teacherForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const teacher = {

                        name:
                            document
                            .getElementById("teacherName")
                            .value
                            .trim(),

                        email:
                            document
                            .getElementById("teacherEmail")
                            .value
                            .trim(),

                        username:
                            document
                            .getElementById("teacherUsername")
                            .value
                            .trim(),

                        password:
                            document
                            .getElementById("teacherPassword")
                            .value

                    };


                    localStorage.setItem(
                        "learnlensTeacher",
                        JSON.stringify(teacher)
                    );


                    alert(
                        "Teacher account created successfully!"
                    );


                    window.location.href =
                        "login.html?role=teacher";

                }
            );

    </script>


</body>

</html>
